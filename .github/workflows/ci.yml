name: ✅ CI — Syntax Check

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  syntax-check:
    name: Python Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install all packages directly
        run: |
          python -m pip install --upgrade pip
          pip install streamlit langchain-groq langchain-core langchain-community duckduckgo-search tavily-python requests

      - name: 🔍 Find and check Python files
        run: |
          echo "📁 Files in repo:"
          ls -la
          echo ""
          echo "🔍 Checking all .py files for syntax errors..."
          for f in *.py; do
            if [ -f "$f" ]; then
              echo "Checking: $f"
              python -m py_compile "$f" && echo "✅ $f — OK"
            fi
          done
